<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Linhu preview</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #f2e9da; }
    body {
      background-image:
        linear-gradient(45deg, #e4d7c3 25%, transparent 25%),
        linear-gradient(-45deg, #e4d7c3 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e4d7c3 75%),
        linear-gradient(-45deg, transparent 75%, #e4d7c3 75%);
      background-size: 32px 32px;
      background-position: 0 0, 0 16px, 16px -16px, -16px 0px;
      display: flex; align-items: center; justify-content: center;
      font-family: "Microsoft YaHei UI", sans-serif;
    }
    figure { margin: 0; width: 260px; text-align: center; }
    img { width: 260px; height: 260px; display: block; object-fit: contain; }
    figcaption { margin-top: 8px; font-size: 16px; color: #6b4b37; }
  </style>
</head>
<body>
  <figure><img src="../assets/linhu.png" alt="linhu"><figcaption>reference image</figcaption></figure>
</body>
</html>
