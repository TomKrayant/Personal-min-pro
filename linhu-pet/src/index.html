<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>林虎桌宠</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app">
    <div id="bubble" class="bubble" aria-live="polite">
      <span id="bubbleText">呼…呼…</span>
    </div>

    <section id="stage" class="stage" aria-label="林虎桌宠，拖动可以移动位置">
      <div class="stage-glow"></div>
      <div class="sparkles" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </div>
      <div class="drag-motion" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </div>
      <img id="pet" class="pet" src="../assets/linhu.png" alt="Q版林虎" draggable="false">
      <div class="drag-sweat" aria-hidden="true"></div>
      <div class="pet-shadow" aria-hidden="true"></div>
    </section>

    <section id="panel" class="panel" aria-label="DSH token 信息">
      <div class="panel-stripes" aria-hidden="true"></div>
      <header class="panel-head">
        <div class="brand">
          <span class="paw-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 13.2c-2.4 0-5.6 3.2-5.6 5.1 0 1.2.8 1.9 1.9 1.9 1.2 0 2.2-.9 3.7-.9s2.5.9 3.7.9c1.1 0 1.9-.7 1.9-1.9 0-1.9-3.2-5.1-5.6-5.1Z"/><ellipse cx="6.1" cy="10.2" rx="2.2" ry="2.9"/><ellipse cx="17.9" cy="10.2" rx="2.2" ry="2.9"/><ellipse cx="9.5" cy="6.1" rx="2.1" ry="2.7"/><ellipse cx="14.5" cy="6.1" rx="2.1" ry="2.7"/></svg>
          </span>
          <span class="brand-name">林虎</span>
          <span class="brand-sub">DSH 桌宠</span>
        </div>
        <div class="head-right">
          <div id="statusPill" class="status-pill idle">
            <span class="status-dot"></span>
            <span id="statusText">打盹中</span>
          </div>
          <button id="collapseBtn" class="icon-btn" title="收起信息面板" aria-label="收起信息面板">⌄</button>
        </div>
      </header>

      <div class="hero">
        <div class="hero-main">
          <span id="todayTokens" class="today-value" title="今日 token 总吞吐（包含缓存读取）">0</span>
          <span class="today-unit">tokens today</span>
        </div>
        <div class="hero-sub">
          <span>入 <b id="todayInput">0</b></span>
          <span class="dot">·</span>
          <span>出 <b id="todayOutput">0</b></span>
          <span class="dot">·</span>
          <span><b id="todayCalls">0</b> 次请求</span>
        </div>
      </div>

      <div class="metrics">
        <div class="metric">
          <span id="cacheHit" class="metric-value">--</span>
          <span class="metric-label">缓存命中</span>
        </div>
        <div class="metric">
          <span id="sessionTokens" class="metric-value">--</span>
          <span class="metric-label">本会话</span>
        </div>
        <div class="metric">
          <span id="contextPercent" class="metric-value">--</span>
          <span class="metric-label">上下文</span>
        </div>
      </div>

      <div class="context-row">
        <div class="context-track"><i id="contextBar"></i></div>
        <span id="contextLabel" class="context-label">0 / 1M</span>
      </div>

      <footer class="panel-foot">
        <div class="session">
          <span id="sessionTitle" class="session-title">等待 DSH 数据…</span>
          <span id="sessionMeta" class="session-meta">deepseek · 0 次调用</span>
        </div>
        <button id="openDshBtn" class="open-btn" title="打开 DeepSeek Harness">
          <span>打开 DSH</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3h8v8M13 3 6 10M11 9v4H3V5h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </footer>
    </section>

    <button id="compactChip" class="compact-chip" aria-label="展开 token 信息">
      <span class="chip-dot"></span>
      <span id="chipTokens">0</span>
      <span class="chip-label">tokens today</span>
      <span class="chip-arrow">⌃</span>
    </button>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="renderer.js"></script>
</body>
</html>
